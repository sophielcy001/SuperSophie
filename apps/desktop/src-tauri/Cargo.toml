[package]
name = "zhiye-desktop"
description = "Zhiye local knowledge base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
performance-probe = []

[dependencies]
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"
tempfile = "3.27"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
url = "2.5"
uuid = { version = "1.29", features = ["v4"] }
zhiye-core = { path = "../../../crates/core" }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication"] }

